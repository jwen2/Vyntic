  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

nature accent — CTAs, highlights, active */\n  --oxblood-2:#8a3223;  /* accent hover */\n  --forest:#2f6b4f;     /* positive / growth only */\n  --ivory:#f4f1ea;      /* app + marketing base */\n  --paper:#ffffff;      /* raised surfaces / cards */\n  --sand:#faf8f3;       /* subtle fill / rails */\n  --soft:#f2e5e1;       /* oxblood tint fill (chips, active docs) */\n  --muted:#8a8478;      /* captions, meta, mono labels */\n  --line:rgba(20,25,35,0.10);\n  --line-2:rgba(20,25,35,0.16);\n  /* status */\n  --sev-material:#c0392b;\n  --sev-moderate:#c98a2b;\n  --sev-note:#2f6b4f;\n  /* type */\n  --serif:'Playfair Display',Georgia,serif;\n  --sans:'Hanken Grotesk',system-ui,sans-serif;\n  --mono:'DM Mono',ui-monospace,monospace;\n  /* radius + shadow */\n  --r-sm:7px;--r-md:10px;--r-lg:14px;--r-xl:20px;\n  --sh-1:0 1px 2px rgba(20,25,35,0.06);\n  --sh-2:0 8px 24px -10px rgba(20,25,35,0.18);\n  --sh-3:0 24px 60px -20px rgba(20,25,35,0.30);\n}\n*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}\nhtml{scroll-behavior:smooth}\nbody{font-family:var(--sans);background:var(--ivory);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}\na{color:var(--oxblood);text-decoration:none}\na:hover{color:var(--oxblood-2)}\n.serif{font-family:var(--serif)}\n.mono{font-family:var(--mono)}\n\n/* layout */\n.wrap{max-width:1080px;margin:0 auto;padding:0 40px}\n.sec{padding:64px 0;border-top:1px solid var(--line)}\n.sec:first-of-type{border-top:none}\n.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:var(--oxblood);margin-bottom:14px}\nh2.sh{font-family:var(--serif);font-size:38px;font-weight:600;letter-spacing:-0.02em;line-height:1.05}\n.lede{font-size:16px;color:var(--ink-2);max-width:640px;margin-top:14px}\nh3.sub{font-family:var(--serif);font-size:22px;font-weight:600;margin:36px 0 16px}\n.grid{display:grid;gap:16px}\n\n/* hero */\n.hero{padding:80px 0 64px;text-align:center}\n.hero .wm{font-family:var(--serif);font-size:76px;font-weight:600;letter-spacing:-0.02em;line-height:1}\n.hero .tag{font-family:var(--mono);font-size:14px;letter-spacing:0.42em;text-transform:uppercase;color:var(--muted);margin-top:12px;padding-left:0.42em}\n.hero h1{font-family:var(--serif);font-size:34px;font-weight:600;letter-spacing:-0.015em;margin-top:40px}\n.hero p{max-width:560px;margin:14px auto 0;color:var(--ink-2)}\n\n/* TOC */\n.toc{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:34px}\n.toc a{font-size:13px;font-weight:600;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:100px;padding:7px 15px}\n.toc a:hover{border-color:var(--oxblood);color:var(--oxblood)}\n\n/* swatches */\n.pal{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}\n.swatch{border-radius:var(--r-md);overflow:hidden;border:1px solid var(--line);background:var(--paper)}\n.swatch .chip{height:90px}\n.swatch .info{padding:11px 13px}\n.swatch .nm{font-weight:600;font-size:13.5px}\n.swatch .hex{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:2px}\n.swatch .role{font-size:11px;color:var(--ink-2);margin-top:6px;line-height:1.4}\n\n/* token table */\n.tbl{width:100%;border-collapse:collapse;font-size:13px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}\n.tbl th{text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:11px 16px;background:var(--sand);border-bottom:1px solid var(--line)}\n.tbl td{padding:10px 16px;border-bottom:1px solid var(--line);vertical-align:top}\n.tbl tr:last-child td{border-bottom:none}\n.tbl code{font-family:var(--mono);font-size:12px;color:var(--oxblood);background:var(--soft);padding:1px 6px;border-radius:4px}\n.tbl .val{font-family:var(--mono);font-size:12px;color:var(--ink-2)}\n\n/* type specimens */\n.spec{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);padding:20px 22px;margin-bottom:12px}\n.spec .lab{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:10px}\n.spec .lab b{color:var(--oxblood);font-weight:500}\n\n/* component cards */\n.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px}\n.demo{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:22px;background:var(--sand);border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:14px}\n.demo.dark{background:#0e1a17;border-color:rgba(255,255,255,0.08)}\n.code{font-family:var(--mono);font-size:12px;line-height:1.7;background:#0e1a17;color:#d7e0da;border-radius:var(--r-md);padding:16px 18px;overflow-x:auto;white-space:pre}\n.code .k{color:#c9a34a}.code .s{color:#e8b9a0}.code .c{color:#6f8a7b}\n\n/* buttons */\n.btn{font-family:var(--sans);font-size:13.5px;font-weight:600;padding:9px 17px;border-radius:var(--r-sm);border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:8px}\n.btn-primary{background:var(--oxblood);color:var(--ivory)}\n.btn-primary:hover{background:var(--oxblood-2)}\n.btn-ink{background:var(--ink);color:var(--ivory)}\n.btn-secondary{background:var(--paper);color:var(--ink);border-color:var(--line-2)}\n.btn-ghost{background:transparent;color:var(--ink)}\n.btn-sm{font-size:12px;padding:6px 12px}\n\n/* inputs */\n.inp{font-family:var(--sans);font-size:13.5px;padding:10px 13px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--paper);color:var(--ink);min-width:220px}\n.inp::placeholder{color:var(--muted)}\n.inp:focus{outline:none;border-color:var(--oxblood);box-shadow:0 0 0 3px var(--soft)}\n\n/* badges + chips */\n.badge{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:0.04em;padding:3px 8px;border-radius:5px;text-transform:uppercase}\n.b-material{background:#f7e4e1;color:var(--sev-material)}\n.b-moderate{background:#f6ecd8;color:#9a6a1f}\n.b-note{background:#e2efe7;color:var(--sev-note)}\n.b-neutral{background:var(--sand);color:var(--muted);border:1px solid var(--line)}\n.chip{display:inline-flex;align-items:center;gap:7px;background:var(--soft);border:1px solid rgba(163,64,47,0.18);border-radius:100px;padding:5px 13px;font-size:12px;font-weight:600;color:var(--oxblood)}\n.chip .pdot{width:6px;height:6px;border-radius:50%;background:var(--oxblood)}\n.cite{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:4px;background:var(--soft);color:var(--oxblood);font-size:10.5px;font-weight:700;font-family:var(--mono)}\n\n/* flag */\n.flag{border:1px solid var(--line);border-left:3px solid var(--sev-material);border-radius:var(--r-sm);padding:11px 13px;background:var(--paper);max-width:280px}\n.flag .ft{font-size:12.5px;font-weight:600;line-height:1.35}\n.flag .fm{font-family:var(--mono);font-size:9.5px;color:var(--muted);margin-top:6px}\n\n/* do/don't */\n.dd{display:grid;grid-template-columns:1fr 1fr;gap:16px}\n.dd .col{border-radius:var(--r-md);padding:18px 20px;border:1px solid var(--line)}\n.dd .do{background:#eef5f0;border-color:#cfe4d8}\n.dd .dont{background:#f9ece9;border-color:#eccfc8}\n.dd h4{font-size:13px;font-family:var(--mono);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:10px}\n.dd .do h4{color:var(--sev-note)}\n.dd .dont h4{color:var(--sev-material)}\n.dd li{font-size:13px;margin:6px 0 6px 18px;color:var(--ink-2)}\n\n/* dark theme block */\n.darkblock{background:#0e1a17;color:#eaf0ec;border-radius:var(--r-lg);padding:28px;border:1px solid rgba(255,255,255,0.08)}\n.darkblock .pal .swatch{background:#14231e;border-color:rgba(255,255,255,0.08)}\n.darkblock .swatch .info .nm{color:#eaf0ec}\n.darkblock .swatch .role{color:#a9b8b0}\n.darkblock .swatch .hex{color:#7f938a}\n\n.note{font-size:13px;color:var(--ink-2);background:var(--sand);border:1px solid var(--line);border-left:3px solid var(--oxblood);border-radius:var(--r-sm);padding:12px 15px;margin-top:14px}\n.footer{padding:50px 0 70px;text-align:center;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}\n.dl{display:inline-flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}\n.dl a{font-size:12.5px;font-weight:600;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 13px;color:var(--ink)}\n.dl a:hover{border-color:var(--oxblood);color:var(--oxblood)}\n@media print{.toc,.hero .tag{}.sec{break-inside:avoid}}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<!-- ═══ HERO ═══ -->\n<div class=\"wrap hero\">\n  <div class=\"wm\">Vyntic<\u002Fdiv>\n  <div class=\"tag\">Intelligence<\u002Fdiv>\n  <div class=\"eyebrow\" style=\"margin-top:34px\">Design System · v1.0 · Handoff Spec<\u002Fdiv>\n  <h1>The house style for deal intelligence<\u002Fh1>\n  <p>This is the single source of truth for Vyntic's brand and product UI. It defines the logo, palette, type, components, and layout patterns — with copy-paste tokens and code. Built for the LP audience: institutional, editorial, understated.<\u002Fp>\n  <div class=\"toc\">\n    <a href=\"#logo\">Logo<\u002Fa><a href=\"#color\">Color<\u002Fa><a href=\"#type\">Type<\u002Fa><a href=\"#components\">Components<\u002Fa><a href=\"#patterns\">Layout<\u002Fa><a href=\"#dark\">Dark theme<\u002Fa><a href=\"#voice\">Voice<\u002Fa><a href=\"#assets\">Assets<\u002Fa>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ═══ PRINCIPLES ═══ -->\n<div class=\"wrap\">\n<div class=\"sec\">\n  <div class=\"eyebrow\">Principles<\u002Fdiv>\n  <h2 class=\"sh\">Five rules that keep us premium<\u002Fh2>\n  <div class=\"grid\" style=\"grid-template-columns:repeat(2,1fr);margin-top:26px\">\n    <div class=\"card\"><h3 class=\"sub\" style=\"margin:0 0 8px\">1 · Serif carries the brand<\u002Fh3><p style=\"font-size:14px;color:var(--ink-2)\">Every heading, wordmark, and hero line is Playfair Display. This one choice separates us from generic blue SaaS. Body and UI stay in a clean sans.<\u002Fp><\u002Fdiv>\n    <div class=\"card\"><h3 class=\"sub\" style=\"margin:0 0 8px\">2 · Ivory, not white<\u002Fh3><p style=\"font-size:14px;color:var(--ink-2)\">Backgrounds are warm ivory (#f4f1ea). It reads like paper — a printed prospectus, not a dashboard. Pure white is reserved for raised cards.<\u002Fp><\u002Fdiv>\n    <div class=\"card\"><h3 class=\"sub\" style=\"margin:0 0 8px\">3 · Oxblood is precious<\u002Fh3><p style=\"font-size:14px;color:var(--ink-2)\">The accent appears rarely and with intent: primary CTAs, active states, citations, material flags. If everything is oxblood, nothing is.<\u002Fp><\u002Fdiv>\n    <div class=\"card\"><h3 class=\"sub\" style=\"margin:0 0 8px\">4 · Whitespace is confidence<\u002Fh3><p style=\"font-size:14px;color:var(--ink-2)\">Generous margins, few elements per view. We're advising sophisticated capital — restraint signals that we don't need to shout.<\u002Fp><\u002Fdiv>\n    <div class=\"card\"><h3 class=\"sub\" style=\"margin:0 0 8px\">5 · Every claim is sourced<\u002Fh3><p style=\"font-size:14px;color:var(--ink-2)\">Citations are a first-class UI primitive, not an afterthought. The interface should always show where an answer came from.<\u002Fp><\u002Fdiv>\n    <div class=\"card\" style=\"background:var(--ink);color:var(--ivory);border-color:var(--ink)\"><h3 class=\"sub\" style=\"margin:0 0 8px;color:var(--ivory)\">The one-line test<\u002Fh3><p style=\"font-size:14px;color:#c8cdd6\">“Would this look at home in a printed IC memo from a top-quartile fund?” If yes, ship it.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ═══ LOGO ═══ -->\n<div class=\"sec\" id=\"logo\">\n  <div class=\"eyebrow\">Logo — “The Journal”<\u002Fdiv>\n  <h2 class=\"sh\">Wordmark first, always<\u002Fh2>\n  <p class=\"lede\">Vyntic is a wordmark-only identity: Playfair Display “Vyntic” with an optional tracked “Intelligence” tagline in DM Mono. No symbol competes with it. This is the most premium, editorial move in the category.<\u002Fp>\n\n  <h3 class=\"sub\">Primary lockup<\u002Fh3>\n  <div class=\"demo\" style=\"justify-content:center;padding:44px\"><img src=\"8e691991-80a4-4c9f-875f-b196d0ba2156\" alt=\"Vyntic Intelligence lockup\" style=\"height:96px\"><\u002Fdiv>\n\n  <h3 class=\"sub\">Variants<\u002Fh3>\n  <div class=\"grid\" style=\"grid-template-columns:repeat(3,1fr)\">\n    <div class=\"demo\" style=\"justify-content:center;flex-direction:column;gap:6px\"><img src=\"ef8b2cbc-02f9-46bf-a4ff-d05e7893a39f\" style=\"height:48px\" alt=\"ink wordmark\"><span class=\"mono\" style=\"font-size:10px;color:var(--muted)\">Wordmark · ink<\u002Fspan><\u002Fdiv>\n    <div class=\"demo dark\" style=\"justify-content:center;flex-direction:column;gap:6px\"><img src=\"7aa2350e-20f8-4f50-b05e-b6b6863b6e90\" style=\"height:48px\" alt=\"ivory wordmark\"><span class=\"mono\" style=\"font-size:10px;color:#8fa89b\">Wordmark · ivory (on dark)<\u002Fspan><\u002Fdiv>\n    <div class=\"demo\" style=\"justify-content:center;flex-direction:column;gap:6px\"><img src=\"fb5ed906-a2af-4a38-acb5-66e4ca33e637\" style=\"height:52px\" alt=\"favicon\"><span class=\"mono\" style=\"font-size:10px;color:var(--muted)\">App icon / favicon<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"note\">The favicon “V” monogram is the <b>only<\u002Fb> approved symbol, and it exists solely for square contexts (browser tab, app icon, avatar). Never place it beside the wordmark as a combined lockup.<\u002Fdiv>\n\n  <h3 class=\"sub\">Rules<\u002Fh3>\n  <div class=\"dd\">\n    <div class=\"col do\"><h4>Do<\u002Fh4><ul><li>Keep clear space of at least the cap-height of “V” on all sides.<\u002Fli><li>Use ink on light grounds, ivory on dark.<\u002Fli><li>Set the tagline in DM Mono, uppercase, 0.42em tracking.<\u002Fli><li>Minimum wordmark width: 96px digital.<\u002Fli><\u002Ful><\u002Fdiv>\n    <div class=\"col dont\"><h4>Don't<\u002Fh4><ul><li>Don't recolor the wordmark to oxblood except as a rare editorial accent.<\u002Fli><li>Don't add a symbol, icon, or the old gradient “V.”<\u002Fli><li>Don't set it in any font but Playfair Display.<\u002Fli><li>Don't stretch, outline, or add shadow.<\u002Fli><\u002Ful><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ═══ COLOR ═══ -->\n<div class=\"sec\" id=\"color\">\n  <div class=\"eyebrow\">Color<\u002Fdiv>\n  <h2 class=\"sh\">Ink, ivory, and a single oxblood<\u002Fh2>\n  <p class=\"lede\">A restrained institutional palette. Neutrals do 95% of the work; oxblood is the signature; forest green appears only for positive metrics.<\u002Fp>\n\n  <h3 class=\"sub\">Brand<\u002Fh3>\n  <div class=\"pal\">\n    <div class=\"swatch\"><div class=\"chip\" style=\"background:#16202e\"><\u002Fdiv><div class=\"info\"><div class=\"nm\">Ink<\u002Fdiv><div class=\"hex\">#16202E<\u002Fdiv><div class=\"role\">Primary text, wordmark, ink buttons<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"swatch\"><div class=\"chip\" style=\"background:#a3402f\"><\u002Fdiv><div class=\"info\"><div class=\"nm\">Oxblood<\u002Fdiv><div class=\"hex\">#A3402F<\u002Fdiv><div class=\"role\">Signature accent — CTAs, active, citations<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"swatch\"><div class=\"chip\" style=\"background:#f4f1ea\"><\u002Fdiv><div class=\"info\"><div class=\"nm\">Ivory<\u002Fdiv><div class=\"hex\">#F4F1EA<\u002Fdiv><div class=\"role\">App + marketing base ground<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"swatch\"><div class=\"chip\" style=\"background:#ffffff;box-shadow:inset 0 0 0 1px var(--line)\"><\u002Fdiv><div class=\"info\"><div class=\"nm\">Paper<\u002Fdiv><div class=\"hex\">#FFFFFF<\u002Fdiv><div class=\"role\">Raised cards &amp; surfaces<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <h3 class=\"sub\">Supporting<\u002Fh3>\n  <div class=\"pal\">\n    <div class=\"swatch\"><div class=\"chip\" style=\"background:#faf8f3;box-shadow:inset 0 0 0 1px var(--line)\"><\u002Fdiv><div class=\"info\"><div class=\"nm\">Sand<\u002Fdiv><div class=\"hex\">#FAF8F3<\u002Fdiv><div class=\"role\">Rails, subtle fills, table headers<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"swatch\"><div class=\"chip\" style=\"background:#f2e5e1\"><\u002Fdiv><div class=\"info\"><div class=\"nm\">Soft<\u002Fdiv><div class=\"hex\">#F2E5E1<\u002Fdiv><div class=\"role\">Oxblood tint — chips, active docs<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"swatch\"><div class=\"chip\" style=\"background:#8a8478\"><\u002Fdiv><div class=\"info\"><div class=\"nm\">Muted<\u002Fdiv><div class=\"hex\">#8A8478<\u002Fdiv><div class=\"role\">Captions, meta, mono labels<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"swatch\"><div class=\"chip\" style=\"background:#2f6b4f\"><\u002Fdiv><div class=\"info\"><div class=\"nm\">Forest<\u002Fdiv><div class=\"hex\">#2F6B4F<\u002Fdiv><div class=\"role\">Positive metrics / growth ONLY<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <h3 class=\"sub\">Status — severity scale<\u002Fh3>\n  <div class=\"pal\">\n    <div class=\"swatch\"><div class=\"chip\" style=\"background:#c0392b\"><\u002Fdiv><div class=\"info\"><div class=\"nm\">Material<\u002Fdiv><div class=\"hex\">#C0392B<\u002Fdiv><div class=\"role\">High-severity red flags<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"swatch\"><div class=\"chip\" style=\"background:#c98a2b\"><\u002Fdiv><div class=\"info\"><div class=\"nm\">Moderate<\u002Fdiv><div class=\"hex\">#C98A2B<\u002Fdiv><div class=\"role\">Medium-severity items<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"swatch\"><div class=\"chip\" style=\"background:#2f6b4f\"><\u002Fdiv><div class=\"info\"><div class=\"nm\">Note<\u002Fdiv><div class=\"hex\">#2F6B4F<\u002Fdiv><div class=\"role\">Low-severity / informational<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"swatch\"><div class=\"chip\" style=\"background:linear-gradient(90deg,#16202e 0 33%,#a3402f 33% 66%,#f4f1ea 66% 100%)\"><\u002Fdiv><div class=\"info\"><div class=\"nm\">Ratio note<\u002Fdiv><div class=\"hex\">AA verified<\u002Fdiv><div class=\"role\">Ink &amp; oxblood on ivory both ≥ 4.5:1<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ═══ TYPE ═══ -->\n<div class=\"sec\" id=\"type\">\n  <div class=\"eyebrow\">Typography<\u002Fdiv>\n  <h2 class=\"sh\">Playfair, Hanken, DM Mono<\u002Fh2>\n  <p class=\"lede\">Display serif for voice, a neutral grotesk for interface, a mono for data and labels. Three families, no exceptions.<\u002Fp>\n\n  <div class=\"spec\"><div class=\"lab\"><b>Display / H1<\u002Fb> — Playfair Display · 600 · −0.02em · 1.05<\u002Fdiv><div class=\"serif\" style=\"font-size:52px;font-weight:600;letter-spacing:-0.02em;line-height:1.05\">Decisions in minutes.<\u002Fdiv><\u002Fdiv>\n  <div class=\"spec\"><div class=\"lab\"><b>H2 / Section<\u002Fb> — Playfair Display · 600 · −0.02em<\u002Fdiv><div class=\"serif\" style=\"font-size:34px;font-weight:600;letter-spacing:-0.02em\">EBITDA margin trend analysis<\u002Fdiv><\u002Fdiv>\n  <div class=\"spec\"><div class=\"lab\"><b>H3 / Card title<\u002Fb> — Playfair Display · 600<\u002Fdiv><div class=\"serif\" style=\"font-size:22px;font-weight:600\">Customer concentration risk<\u002Fdiv><\u002Fdiv>\n  <div class=\"spec\"><div class=\"lab\"><b>Body<\u002Fb> — Hanken Grotesk · 400 · 1.6<\u002Fdiv><div style=\"font-size:15px\">Upload your CIMs, financials, and data rooms. Vyntic analyzes every deal side-by-side so your investment committee gets sourced answers in minutes, not weeks.<\u002Fdiv><\u002Fdiv>\n  <div class=\"spec\"><div class=\"lab\"><b>UI label / strong<\u002Fb> — Hanken Grotesk · 600<\u002Fdiv><div style=\"font-size:13.5px;font-weight:600\">Ask agent · See a demo · Export memo<\u002Fdiv><\u002Fdiv>\n  <div class=\"spec\"><div class=\"lab\"><b>Mono / meta<\u002Fb> — DM Mono · 400/500 · uppercase · 0.06–0.42em<\u002Fdiv><div class=\"mono\" style=\"font-size:12px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted)\">CONFIDENCE 87% · QOE · P.23 · MATERIAL<\u002Fdiv><\u002Fdiv>\n\n  <h3 class=\"sub\">Scale reference<\u002Fh3>\n  <table class=\"tbl\">\n    <tbody><tr><th>Token<\u002Fth><th>Family<\u002Fth><th>Size / LH<\u002Fth><th>Weight<\u002Fth><th>Use<\u002Fth><\u002Ftr>\n    <tr><td><code>--text-display<\u002Fcode><\u002Ftd><td class=\"val\">Playfair<\u002Ftd><td class=\"val\">52/54<\u002Ftd><td class=\"val\">600<\u002Ftd><td>Hero headline<\u002Ftd><\u002Ftr>\n    <tr><td><code>--text-h1<\u002Fcode><\u002Ftd><td class=\"val\">Playfair<\u002Ftd><td class=\"val\">38/40<\u002Ftd><td class=\"val\">600<\u002Ftd><td>Page / section title<\u002Ftd><\u002Ftr>\n    <tr><td><code>--text-h2<\u002Fcode><\u002Ftd><td class=\"val\">Playfair<\u002Ftd><td class=\"val\">28/32<\u002Ftd><td class=\"val\">600<\u002Ftd><td>Sub-section<\u002Ftd><\u002Ftr>\n    <tr><td><code>--text-h3<\u002Fcode><\u002Ftd><td class=\"val\">Playfair<\u002Ftd><td class=\"val\">22/28<\u002Ftd><td class=\"val\">600<\u002Ftd><td>Card title<\u002Ftd><\u002Ftr>\n    <tr><td><code>--text-body<\u002Fcode><\u002Ftd><td class=\"val\">Hanken<\u002Ftd><td class=\"val\">15/24<\u002Ftd><td class=\"val\">400<\u002Ftd><td>Paragraph<\u002Ftd><\u002Ftr>\n    <tr><td><code>--text-sm<\u002Fcode><\u002Ftd><td class=\"val\">Hanken<\u002Ftd><td class=\"val\">13.5/20<\u002Ftd><td class=\"val\">400/600<\u002Ftd><td>UI, secondary<\u002Ftd><\u002Ftr>\n    <tr><td><code>--text-meta<\u002Fcode><\u002Ftd><td class=\"val\">DM Mono<\u002Ftd><td class=\"val\">11/16<\u002Ftd><td class=\"val\">400/500<\u002Ftd><td>Labels, meta, data<\u002Ftd><\u002Ftr>\n  <\u002Ftbody><\u002Ftable>\n<\u002Fdiv>\n\n<!-- ═══ COMPONENTS ═══ -->\n<div class=\"sec\" id=\"components\">\n  <div class=\"eyebrow\">Components<\u002Fdiv>\n  <h2 class=\"sh\">The core kit<\u002Fh2>\n  <p class=\"lede\">Everything below is production-ready. Radii are small (7–14px) — precise, not playful. Shadows are soft and rare.<\u002Fp>\n\n  <h3 class=\"sub\">Buttons<\u002Fh3>\n  <div class=\"demo\">\n    <button class=\"btn btn-primary\">See a demo<\u002Fbutton>\n    <button class=\"btn btn-ink\">Ask agent<\u002Fbutton>\n    <button class=\"btn btn-secondary\">Export memo<\u002Fbutton>\n    <button class=\"btn btn-ghost\">Cancel<\u002Fbutton>\n    <button class=\"btn btn-primary btn-sm\">Small<\u002Fbutton>\n  <\u002Fdiv>\n  <div class=\"code\"><span class=\"c\">/* Primary = oxblood, the money action. One per view. */<\u002Fspan>\n.btn-primary{background:<span class=\"k\">#a3402f<\u002Fspan>;color:<span class=\"k\">#f4f1ea<\u002Fspan>;border-radius:<span class=\"k\">7px<\u002Fspan>;\n  padding:<span class=\"k\">9px 17px<\u002Fspan>;font:600 13.5px/1 <span class=\"s\">'Hanken Grotesk'<\u002Fspan>}\n.btn-primary:hover{background:<span class=\"k\">#8a3223<\u002Fspan>}\n<span class=\"c\">/* Ink = neutral primary (agent, nav). Secondary = outline. */<\u002Fspan><\u002Fdiv>\n\n  <h3 class=\"sub\">Inputs<\u002Fh3>\n  <div class=\"demo\">\n    <input class=\"inp\" placeholder=\"What's your email?\">\n    <input class=\"inp\" placeholder=\"Search documents…\">\n    <button class=\"btn btn-primary\">Get started<\u002Fbutton>\n  <\u002Fdiv>\n  <div class=\"code\">.inp:focus{border-color:<span class=\"k\">#a3402f<\u002Fspan>;box-shadow:0 0 0 3px <span class=\"k\">#f2e5e1<\u002Fspan>}<\u002Fdiv>\n\n  <h3 class=\"sub\">Badges &amp; severity<\u002Fh3>\n  <div class=\"demo\">\n    <span class=\"badge b-material\">Material<\u002Fspan>\n    <span class=\"badge b-moderate\">Moderate<\u002Fspan>\n    <span class=\"badge b-note\">Note<\u002Fspan>\n    <span class=\"badge b-neutral\">3 Deals<\u002Fspan>\n    <span class=\"chip\"><span class=\"pdot\"><\u002Fspan>Now on Gemini 3 Flash<\u002Fspan>\n  <\u002Fdiv>\n\n  <h3 class=\"sub\">Citation &amp; inline source<\u002Fh3>\n  <div class=\"demo\" style=\"display:block\">\n    <p style=\"font-size:14px;max-width:560px\">Adjusted EBITDA compressed from <strong>28.4%<\u002Fstrong> to <strong>19.2%<\u002Fstrong> <span class=\"cite\">1<\u002Fspan> over three years, driven by rising R&amp;D intensity <span class=\"cite\">2<\u002Fspan>.<\u002Fp>\n    <div style=\"display:flex;gap:8px;margin-top:12px\"><span class=\"badge b-neutral\">QoE·p8<\u002Fspan><span class=\"badge b-neutral\">Fin·p3<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <h3 class=\"sub\">Red-flag card<\u002Fh3>\n  <div class=\"demo\">\n    <div class=\"flag\"><div class=\"ft\">Customer concentration: top 3 = 61% of ARR<\u002Fdiv><div class=\"fm\">QOE · P.23 · CONFIDENCE 94%<\u002Fdiv><\u002Fdiv>\n    <div class=\"flag\" style=\"border-left-color:var(--sev-moderate)\"><div class=\"ft\">Rev-rec policy changed FY22 → FY23<\u002Fdiv><div class=\"fm\">FINANCIALS · P.4 · CONFIDENCE 89%<\u002Fdiv><\u002Fdiv>\n    <div class=\"flag\" style=\"border-left-color:var(--sev-note)\"><div class=\"ft\">Standard MSA terms, no unusual clauses<\u002Fdiv><div class=\"fm\">LEGAL DD · P.12 · CONFIDENCE 91%<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"note\">Severity is encoded in the <b>left border only<\u002Fb> — the card body stays neutral so a wall of flags doesn't turn into a wall of red. The mono meta line always carries source + page + confidence.<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ═══ LAYOUT PATTERNS ═══ -->\n<div class=\"sec\" id=\"patterns\">\n  <div class=\"eyebrow\">Layout patterns<\u002Fdiv>\n  <h2 class=\"sh\">How the product is composed<\u002Fh2>\n  <p class=\"lede\">The workspace is a three-column reading environment: sources on the left, the sourced answer in the center, flags on the right. It should feel like reading a memo, not operating a console.<\u002Fp>\n\n  <div class=\"card\" style=\"padding:0;overflow:hidden\">\n    <div style=\"display:flex;align-items:center;gap:11px;padding:11px 18px;border-bottom:1px solid var(--line);background:var(--paper)\">\n      <span class=\"serif\" style=\"font-size:17px;font-weight:600\">Vyntic<\u002Fspan>\n      <span style=\"color:var(--line)\">›<\u002Fspan><span style=\"font-size:13px;font-weight:600\">Acme SaaS<\u002Fspan>\n      <span class=\"badge b-neutral\">Due Diligence<\u002Fspan><span style=\"flex:1\"><\u002Fspan>\n      <button class=\"btn btn-ink btn-sm\">Ask agent ⌘K<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:190px 1fr 250px;min-height:280px\">\n      <div style=\"border-right:1px solid var(--line);background:var(--sand);padding:14px 12px\">\n        <div class=\"mono\" style=\"font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px\">Documents · 5<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;background:var(--soft);font-size:12px;color:var(--oxblood);font-weight:600\">▣ CIM.pdf<\u002Fdiv>\n        <div style=\"padding:8px 10px;font-size:12px;color:var(--ink)\">QoE Report<\u002Fdiv>\n        <div style=\"padding:8px 10px;font-size:12px;color:var(--ink)\">Financials<\u002Fdiv>\n        <div style=\"padding:8px 10px;font-size:12px;color:var(--ink)\">Legal DD<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:20px 24px\">\n        <div style=\"display:flex;gap:8px;margin-bottom:8px\"><span class=\"badge b-material\">Material<\u002Fspan><span class=\"mono\" style=\"font-size:10px;color:var(--muted)\">CONFIDENCE 87%<\u002Fspan><\u002Fdiv>\n        <h3 class=\"serif\" style=\"font-size:22px;font-weight:600;margin-bottom:12px\">EBITDA margin trend analysis<\u002Fh3>\n        <p style=\"font-size:13.5px;line-height:1.7\">Adjusted EBITDA margin compressed from <strong>28.4% (FY21)<\u002Fstrong> to <strong>19.2% (FY23)<\u002Fstrong> <span class=\"cite\">1<\u002Fspan>. Key drivers: R&amp;D rose 18%→24% of revenue <span class=\"cite\">1<\u002Fspan>, infra costs grew +47% <span class=\"cite\">2<\u002Fspan>.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border-left:1px solid var(--line);background:var(--sand);padding:14px 12px;display:flex;flex-direction:column;gap:9px\">\n        <div class=\"mono\" style=\"font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted)\">Red Flags · 7<\u002Fdiv>\n        <div class=\"flag\" style=\"max-width:none\"><div class=\"ft\">Top 3 = 61% of ARR<\u002Fdiv><div class=\"fm\">QOE · P.23<\u002Fdiv><\u002Fdiv>\n        <div class=\"flag\" style=\"max-width:none;border-left-color:var(--sev-moderate)\"><div class=\"ft\">Rev-rec policy change<\u002Fdiv><div class=\"fm\">FIN · P.4<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"grid\" style=\"grid-template-columns:repeat(3,1fr);margin-top:16px\">\n    <div class=\"card\"><div class=\"mono\" style=\"font-size:10px;color:var(--oxblood);text-transform:uppercase;letter-spacing:0.06em\">Left rail<\u002Fdiv><p style=\"font-size:13px;color:var(--ink-2);margin-top:8px\">Sand background. Documents list with page counts + flag badges. Active doc uses soft-oxblood fill.<\u002Fp><\u002Fdiv>\n    <div class=\"card\"><div class=\"mono\" style=\"font-size:10px;color:var(--oxblood);text-transform:uppercase;letter-spacing:0.06em\">Center<\u002Fdiv><p style=\"font-size:13px;color:var(--ink-2);margin-top:8px\">Paper/ivory. Serif answer title, generous line-height, inline citations. This is the reading surface.<\u002Fp><\u002Fdiv>\n    <div class=\"card\"><div class=\"mono\" style=\"font-size:10px;color:var(--oxblood);text-transform:uppercase;letter-spacing:0.06em\">Right rail<\u002Fdiv><p style=\"font-size:13px;color:var(--ink-2);margin-top:8px\">Sand background. Severity-sorted flags, each with source + confidence in mono.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ═══ DARK THEME ═══ -->\n<div class=\"sec\" id=\"dark\">\n  <div class=\"eyebrow\">Dark product theme<\u002Fdiv>\n  <h2 class=\"sh\">Light marketing, dark workspace<\u002Fh2>\n  <p class=\"lede\">The optional product theme for long analysis sessions. Same palette logic inverted onto a deep ink-green ground — closer to a private client terminal. Marketing stays ivory.<\u002Fp>\n  <div class=\"darkblock\">\n    <div class=\"pal\">\n      <div class=\"swatch\"><div class=\"chip\" style=\"background:#0e1a17\"><\u002Fdiv><div class=\"info\"><div class=\"nm\">Canvas<\u002Fdiv><div class=\"hex\">#0E1A17<\u002Fdiv><div class=\"role\">App background<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"swatch\"><div class=\"chip\" style=\"background:#14231e\"><\u002Fdiv><div class=\"info\"><div class=\"nm\">Surface<\u002Fdiv><div class=\"hex\">#14231E<\u002Fdiv><div class=\"role\">Cards, rails<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"swatch\"><div class=\"chip\" style=\"background:#c47a5f\"><\u002Fdiv><div class=\"info\"><div class=\"nm\">Oxblood-lt<\u002Fdiv><div class=\"hex\">#C47A5F<\u002Fdiv><div class=\"role\">Accent, lifted for contrast<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div class=\"swatch\"><div class=\"chip\" style=\"background:#eaf0ec\"><\u002Fdiv><div class=\"info\"><div class=\"nm\">Text<\u002Fdiv><div class=\"hex\">#EAF0EC<\u002Fdiv><div class=\"role\">Primary text on dark<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:20px;background:#14231e;border:1px solid rgba(255,255,255,0.08);border-radius:12px;overflow:hidden\">\n      <div style=\"display:flex;align-items:center;gap:11px;padding:11px 18px;border-bottom:1px solid rgba(255,255,255,0.08)\"><span class=\"serif\" style=\"font-size:16px;font-weight:600;color:#eaf0ec\">Vyntic<\u002Fspan><span style=\"color:rgba(255,255,255,0.2)\">›<\u002Fspan><span style=\"font-size:12.5px;color:#c5d0ca\">Acme SaaS<\u002Fspan><span style=\"flex:1\"><\u002Fspan><span style=\"background:#c47a5f;color:#0e1a17;font-size:11px;font-weight:600;padding:5px 11px;border-radius:7px\">Ask agent<\u002Fspan><\u002Fdiv>\n      <div style=\"padding:18px 22px\">\n        <div style=\"display:flex;gap:8px;margin-bottom:8px\"><span class=\"badge\" style=\"background:rgba(196,122,95,0.18);color:#e2a48c\">Material<\u002Fspan><span class=\"mono\" style=\"font-size:10px;color:#7f938a\">CONFIDENCE 87%<\u002Fspan><\u002Fdiv>\n        <div class=\"serif\" style=\"font-size:20px;font-weight:600;color:#eaf0ec;margin-bottom:8px\">EBITDA margin trend analysis<\u002Fdiv>\n        <p style=\"font-size:13px;color:#c5d0ca;line-height:1.7\">Adjusted EBITDA compressed from <strong style=\"color:#eaf0ec\">28.4%<\u002Fstrong> to <strong style=\"color:#eaf0ec\">19.2%<\u002Fstrong> <span style=\"background:rgba(196,122,95,0.2);color:#e2a48c;font-family:var(--mono);font-size:10.5px;font-weight:700;padding:1px 5px;border-radius:4px\">1<\u002Fspan> over three years.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"note\">Dark theme keeps the same tokens — only the <code>--bg / --surface / --ink / --oxblood<\u002Fcode> values swap. Ship it as a <code>[data-theme=\"dark\"]<\u002Fcode> attribute on <code>&lt;html&gt;<\u002Fcode>, not a separate stylesheet.<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ═══ VOICE ═══ -->\n<div class=\"sec\" id=\"voice\">\n  <div class=\"eyebrow\">Voice &amp; tone<\u002Fdiv>\n  <h2 class=\"sh\">How Vyntic talks<\u002Fh2>\n  <p class=\"lede\">We write like a sharp associate briefing a partner: precise, sourced, unhurried. Never breathless, never salesy.<\u002Fp>\n  <div class=\"dd\">\n    <div class=\"col do\"><h4>Do<\u002Fh4><ul><li>“Adjusted EBITDA compressed 920bps over three years.”<\u002Fli><li>Lead with the finding, then the evidence.<\u002Fli><li>Use the language of the IC memo: material, basis points, concentration.<\u002Fli><li>Cite everything. Confidence is shown, not claimed.<\u002Fli><\u002Ful><\u002Fdiv>\n    <div class=\"col dont\"><h4>Don't<\u002Fh4><ul><li>“🚀 Supercharge your deal flow with AI magic!”<\u002Fli><li>Hype, exclamation marks, or emoji.<\u002Fli><li>Vague superlatives (“powerful”, “seamless”, “revolutionary”).<\u002Fli><li>Hedge-free certainty on model output.<\u002Fli><\u002Ful><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"grid\" style=\"grid-template-columns:repeat(3,1fr);margin-top:16px\">\n    <div class=\"card\"><div class=\"mono\" style=\"font-size:10px;color:var(--oxblood);text-transform:uppercase\">Tagline<\u002Fdiv><p class=\"serif\" style=\"font-size:19px;font-weight:600;margin-top:8px\">Deal intelligence, sourced.<\u002Fp><\u002Fdiv>\n    <div class=\"card\"><div class=\"mono\" style=\"font-size:10px;color:var(--oxblood);text-transform:uppercase\">CTA voice<\u002Fdiv><p style=\"font-size:14px;color:var(--ink-2);margin-top:8px\">“See a demo”, “Get started”, “Export memo” — verbs, no fluff.<\u002Fp><\u002Fdiv>\n    <div class=\"card\"><div class=\"mono\" style=\"font-size:10px;color:var(--oxblood);text-transform:uppercase\">Audience<\u002Fdiv><p style=\"font-size:14px;color:var(--ink-2);margin-top:8px\">LPs &amp; IC members at PE firms. Assume fluency; respect their time.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ═══ ASSETS + TOKENS ═══ -->\n<div class=\"sec\" id=\"assets\">\n  <div class=\"eyebrow\">For implementation<\u002Fdiv>\n  <h2 class=\"sh\">Tokens &amp; assets<\u002Fh2>\n  <p class=\"lede\">Framework-agnostic CSS custom properties — drop into <code>:root<\u002Fcode>. Tailwind users: map these into <code>theme.extend.colors<\u002Fcode> / <code>fontFamily<\u002Fcode> with the same names.<\u002Fp>\n  <div class=\"code\"><span class=\"c\">:root {<\u002Fspan>\n  <span class=\"c\">/* color */<\u002Fspan>\n  --ink:<span class=\"k\">#16202e<\u002Fspan>;      --ink-2:<span class=\"k\">#2b3646<\u002Fspan>;\n  --oxblood:<span class=\"k\">#a3402f<\u002Fspan>;  --oxblood-2:<span class=\"k\">#8a3223<\u002Fspan>;\n  --ivory:<span class=\"k\">#f4f1ea<\u002Fspan>;    --paper:<span class=\"k\">#ffffff<\u002Fspan>;\n  --sand:<span class=\"k\">#faf8f3<\u002Fspan>;     --soft:<span class=\"k\">#f2e5e1<\u002Fspan>;\n  --muted:<span class=\"k\">#8a8478<\u002Fspan>;    --forest:<span class=\"k\">#2f6b4f<\u002Fspan>;\n  --line:<span class=\"k\">rgba(20,25,35,.10)<\u002Fspan>;\n  --sev-material:<span class=\"k\">#c0392b<\u002Fspan>; --sev-moderate:<span class=\"k\">#c98a2b<\u002Fspan>; --sev-note:<span class=\"k\">#2f6b4f<\u002Fspan>;\n  <span class=\"c\">/* type */<\u002Fspan>\n  --serif:<span class=\"s\">'Playfair Display'<\u002Fspan>,Georgia,serif;\n  --sans:<span class=\"s\">'Hanken Grotesk'<\u002Fspan>,system-ui,sans-serif;\n  --mono:<span class=\"s\">'DM Mono'<\u002Fspan>,ui-monospace,monospace;\n  <span class=\"c\">/* radius + shadow */<\u002Fspan>\n  --r-sm:<span class=\"k\">7px<\u002Fspan>; --r-md:<span class=\"k\">10px<\u002Fspan>; --r-lg:<span class=\"k\">14px<\u002Fspan>;\n  --sh-2:<span class=\"k\">0 8px 24px -10px rgba(20,25,35,.18)<\u002Fspan>;\n<span class=\"c\">}<\u002Fspan>\n\n<span class=\"c\">/* dark product theme */<\u002Fspan>\n[data-theme=<span class=\"s\">\"dark\"<\u002Fspan>] {\n  --ivory:<span class=\"k\">#0e1a17<\u002Fspan>; --paper:<span class=\"k\">#14231e<\u002Fspan>;\n  --ink:<span class=\"k\">#eaf0ec<\u002Fspan>;   --oxblood:<span class=\"k\">#c47a5f<\u002Fspan>;\n  --sand:<span class=\"k\">#12201c<\u002Fspan>;  --line:<span class=\"k\">rgba(255,255,255,.08)<\u002Fspan>;\n}<\u002Fdiv>\n\n  <div class=\"code\" style=\"margin-top:14px\"><span class=\"c\">&lt;!-- Font loading (put in &lt;head&gt;) --&gt;<\u002Fspan>\n&lt;link href=<span class=\"s\">\"https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;family=DM+Mono:wght@400;500&amp;display=swap\"<\u002Fspan> rel=<span class=\"s\">\"stylesheet\"<\u002Fspan>&gt;<\u002Fdiv>\n\n  <h3 class=\"sub\">Logo files in this project<\u002Fh3>\n  <div class=\"dl\">\n    <a href=\"assets/logo/vyntic-lockup-ink.svg\" download=\"\">vyntic-lockup-ink.svg<\u002Fa>\n    <a href=\"assets/logo/vyntic-wordmark-ink.svg\" download=\"\">vyntic-wordmark-ink.svg<\u002Fa>\n    <a href=\"assets/logo/vyntic-wordmark-ivory.svg\" download=\"\">vyntic-wordmark-ivory.svg<\u002Fa>\n    <a href=\"assets/logo/vyntic-wordmark-oxblood.svg\" download=\"\">vyntic-wordmark-oxblood.svg<\u002Fa>\n    <a href=\"assets/logo/vyntic-favicon-ink.svg\" download=\"\">vyntic-favicon-ink.svg<\u002Fa>\n    <a href=\"assets/logo/vyntic-favicon-ivory.svg\" download=\"\">vyntic-favicon-ivory.svg<\u002Fa>\n    <a href=\"assets/logo/vyntic-favicon-512.png\" download=\"\">vyntic-favicon-512.png<\u002Fa>\n  <\u002Fdiv>\n  <div class=\"note\">SVG wordmarks reference the Playfair Display webfont by name (so text stays crisp at any size). If your cofounder needs the wordmark as outlines for a context without the font loaded, say the word and I'll export a vectorized-path version.<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"footer\">\n  Vyntic Design System · v1.0 · Prepared for implementation handoff · July 2026<br>\n  Source of truth: this page. Questions on any token → ping before diverging.\n<\u002Fdiv>\n<\u002Fdiv>\n\n\n\n\n\n<\u002Fbody><\u002Fhtml>"
