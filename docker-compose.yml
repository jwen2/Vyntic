services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=gemini-3.1-flash-lite
      - GEMINI_FALLBACK_MODEL=gemini-3-flash-preview
      - EMBEDDING_MODEL=models/gemini-embedding-001
      - DATABASE_URL=sqlite:////app/data/vyntic.db
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - UPLOADS_DIR=/app/data/uploads
      - SEED_SAMPLE_DATA=${SEED_SAMPLE_DATA:-true}
    volumes:
      - ./backend/app:/app/app
      - ./data:/app/data
      - ./sample_data:/app/sample_data:ro
    restart: unless-stopped

  # Production-style frontend: vite build + vite preview (see frontend/Dockerfile).
  frontend:
    build: ./frontend
    ports:
      - "3100:3000"
    depends_on:
      - backend
    environment:
      - VITE_API_PROXY_TARGET=http://backend:8000
    restart: unless-stopped

  # Hot-reload dev server (uses the host backend on port 8000).
  frontend-dev:
    build: ./frontend
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3000"]
    ports:
      - "3200:3000"
    environment:
      - VITE_API_PROXY_TARGET=http://host.docker.internal:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped
