services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=gemini-3.1-flash-lite-preview
      - GEMINI_FALLBACK_MODEL=gemini-3-flash-preview
      - EMBEDDING_MODEL=models/gemini-embedding-001
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - AGENTIC_FEATURES=${AGENTIC_FEATURES:-true}
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./sample_data:/app/sample_data:ro
    restart: unless-stopped

  frontend:
    build: ./frontend
    command: ["sh", "./start-prod.sh"]
    ports:
      - "3100:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NEXT_PUBLIC_AGENTIC=${NEXT_PUBLIC_AGENTIC:-1}
      - NEXT_DIST_DIR=.next-docker
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next-docker
    restart: unless-stopped

  # Standalone frontend for development (uses host backend on port 8000)
  frontend-dev:
    build: ./frontend
    command: ["npm", "run", "dev", "--", "-H", "0.0.0.0"]
    ports:
      - "3200:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://host.docker.internal:8000
      - NEXT_PUBLIC_AGENTIC=${NEXT_PUBLIC_AGENTIC:-1}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped
