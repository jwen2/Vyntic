services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=gemini-3-flash-preview
      - GEMINI_FALLBACK_MODEL=gemini-2.5-flash
      - EMBEDDING_MODEL=models/gemini-embedding-001
      - CHROMA_PERSIST_DIR=/app/data/chroma
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./sample_data:/app/sample_data:ro
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3100:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped

  # Standalone frontend for development (uses host backend on port 8000)
  frontend-dev:
    build: ./frontend
    ports:
      - "3200:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://host.docker.internal:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped
