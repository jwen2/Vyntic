services:
  ollama:
    image: ollama/ollama:latest
    profiles: ["cpu"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      default:
        aliases:
          - ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  ollama-gpu:
    image: ollama/ollama:latest
    profiles: ["gpu"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      default:
        aliases:
          - ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=deepseek-r1:8b
      - EMBEDDING_MODEL=nomic-embed-text
      - CHROMA_PERSIST_DIR=/app/data/chroma
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./sample_data:/app/sample_data:ro
    depends_on:
      ollama:
        condition: service_healthy
        required: false
      ollama-gpu:
        condition: service_healthy
        required: false
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3100:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - next_cache:/app/.next
    restart: unless-stopped

  # Standalone frontend for development (uses host backend on port 8000)
  frontend-dev:
    build: ./frontend
    ports:
      - "3200:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://host.docker.internal:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - next_dev_cache:/app/.next
    restart: unless-stopped

volumes:
  ollama_data:
  next_cache:
  next_dev_cache:
