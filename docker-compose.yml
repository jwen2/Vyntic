services:
  # Local Postgres for Plan 4 development (multi-tenancy/RLS work needs a
  # real Postgres; SQLite remains the zero-setup default for the backend
  # service below until the cutover). Matches CI's service container.
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=vyntic
      - POSTGRES_PASSWORD=vyntic
      - POSTGRES_DB=vyntic
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vyntic"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=gemini-3.1-flash-lite
      - GEMINI_FALLBACK_MODEL=gemini-3-flash-preview
      - EMBEDDING_MODEL=models/gemini-embedding-001
      - DATABASE_URL=sqlite:////app/data/vyntic.db
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - UPLOADS_DIR=/app/data/uploads
      - SEED_SAMPLE_DATA=${SEED_SAMPLE_DATA:-true}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-CHANGE-ME-in-production-use-a-real-secret}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-admin}
      # Dev-only: booting on the default secrets above requires this opt-in.
      - ALLOW_INSECURE_DEFAULTS=${ALLOW_INSECURE_DEFAULTS:-false}
    volumes:
      - ./backend/app:/app/app
      - ./data:/app/data
      - ./sample_data:/app/sample_data:ro
    restart: unless-stopped

  # Production-style frontend: vite build + vite preview (see frontend/Dockerfile).
  frontend:
    build: ./frontend
    ports:
      - "3100:3000"
    depends_on:
      - backend
    environment:
      - VITE_API_PROXY_TARGET=http://backend:8000
    restart: unless-stopped

  # Hot-reload dev server (uses the host backend on port 8000).
  frontend-dev:
    build: ./frontend
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3000"]
    ports:
      - "3200:3000"
    environment:
      - VITE_API_PROXY_TARGET=http://host.docker.internal:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped

volumes:
  pgdata:
